name: Generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Momen-Mamdouh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0E7490&color_dots=#EBEDF0,#BAE6FD,#38BDF8,#0284C7,#0369A1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22EBF7&color_dots=#161B22,#0B3A42,#0E7490,#14B8A6,#22EBF7
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}